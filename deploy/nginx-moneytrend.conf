# Money Trend — Nginx (frontend SPA + API proxy)
# Copy to: /etc/nginx/sites-available/moneytrend
# Replace yourdomain.com with your real domain (or use _ for IP-only testing)
#
# IMPORTANT:
# - Use ^~ on /api/ and /uploads/ so image extensions are NOT stolen by the static regex
# - Blogs/News JSON lives at /api/articles/blogs and /api/articles/news (also /api/blogs, /api/news)
# - Hitting /blogs or /news without /api returns the SPA index.html (expected for the React app)

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 25m;

    root /var/www/moneytrend/frontend;
    index index.html;

    # API → Node (PM2) — ^~ wins over regex static location
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
    }

    location ^~ /api-docs {
        proxy_pass http://127.0.0.1:5001/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api-docs.json {
        proxy_pass http://127.0.0.1:5001/api-docs.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Uploaded images (KYC, banners, articles) — MUST use ^~ or .png hits frontend try_files
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
    }

    # SEO files from API
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5001/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:5001/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend hashed assets only (do not match /uploads/* — handled above)
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* ^/(favicon|apple-touch|og-image|site\.webmanifest).*\.(ico|png|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — /blogs and /news pages are React routes (HTML). APIs use /api/...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
